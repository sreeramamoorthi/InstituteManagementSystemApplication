# =====================================================
# Application
# =====================================================
spring.application.name=institute-management-system
server.port=8080

# =====================================================
# PostgreSQL Database Connection
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/institute_db
spring.datasource.username=postgres
spring.datasource.password=masterkey
spring.datasource.driver-class-name=org.postgresql.Driver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# =====================================================
# Jackson - readable date format in JSON responses
# =====================================================
spring.jackson.date-format=yyyy-MM-dd

# =====================================================
# Error handling
# =====================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =====================================================
# JWT
# =====================================================
jwt.secret=ReplaceThisWithALongRandomBase64SecretKeyAtLeast256BitsForHS256Algo==
jwt.expiration-ms=86400000